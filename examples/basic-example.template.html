<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>wxo-js-sdk - Basic Example</title>
  <style>
    body {
      font-family: 'IBM Plex Sans', -apple-system, sans-serif;
      margin: 40px;
      background: #f4f4f4;
      color: #161616;
    }
    h1 { color: #0f62fe; }
  </style>
</head>
<body>
  <h1>wxo-js-sdk テストページ</h1>
  <p>右下のチャットアイコンをクリックして会話を開始してください。</p>

  <div id="root"></div>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>

  <script>
    window.wxOConfiguration = {
      // wxO コンソールの「埋め込み」設定から取得した値を入力
      orchestrationID: 'YOUR_ORCHESTRATION_ID',
      hostURL: 'https://api.REGION.dl.watson-orchestrate.ibm.com',
      crn: 'YOUR_CRN',
      agents: [
        {
          id: 'agent1',
          name: 'AIアシスタント',
          agentId: 'YOUR_AGENT_ID',
          agentEnvironmentId: 'YOUR_AGENT_ENVIRONMENT_ID'
        }
      ],
      debug: true
    };
  </script>

  <!-- ローカルビルド確認用 -->
  <script src="../dist/wxo-sdk.min.js"></script>
  <script>
    wxoLoader.init().catch(console.error);
  </script>
</body>
</html>
